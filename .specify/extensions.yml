# SBR extension hooks — wires sbr-audit and sbr-close-gaps into
# spec-kit's native lifecycle. This file only registers triggers; the actual
# behavior lives in each skill's own SKILL.md, and the RTM schema/vocabulary in
# sbr/README.md. See sbr/README.md -> "Audit mode vs. gating mode" and
# "Posthoc test-genuineness check" for why this project runs the audit after
# every implementation pass instead of gating implementation on tests written
# first.
#
# Hook entry fields:
#   extension    display name shown in the pre/post-hook block
#   command      dotted command id; consuming skills replace "." with "-" to
#                form the slash command (sbr.audit -> /sbr-audit)
#   description  one-line summary shown for optional hooks
#   prompt       suggested framing shown for optional hooks before they're run
#   optional     true = offered, requires explicit confirmation before running;
#                false = mandatory, the hosting skill executes it automatically
#   enabled      true (default) = considered at all; false = skipped entirely

hooks:
  after_implement:
    - extension: "sbr-extension"
      command: "sbr.audit"
      description: "Refresh the RTM for the current feature against the code just implemented."
      optional: false
      enabled: true

  after_sbr_audit:
    - extension: "sbr-extension"
      command: "sbr.close-gaps"
      description: "Close every Gap/Unclassified row this audit just found, dispatching sbr-bugfix once per row."
      prompt: "The audit above found one or more gaps. Run sbr-close-gaps to write the missing tests and update the RTM for each one?"
      optional: true
      enabled: true

  after_sbr_bugfix:
    - extension: "sbr-extension"
      command: "sbr.audit"
      description: "Re-run the audit for the affected feature to confirm the RTM reflects this fix (and hasn't drifted elsewhere)."
      prompt: "A defect was just fixed. Re-run sbr-audit against the affected feature to confirm the RTM is current?"
      optional: true
      enabled: true

  after_sbr_feature_upgrade:
    - extension: "sbr-extension"
      command: "sbr.audit"
      description: "Re-run the audit for the affected feature to confirm the RTM reflects the changed requirement (and hasn't drifted elsewhere)."
      prompt: "A requirement was just upgraded. Re-run sbr-audit against the affected feature to confirm the RTM is current?"
      optional: true
      enabled: true
